name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Portable queue lock tests
        run: bash tests/test_queue_lock.sh
      - name: Syntax checks
        run: |
          python3 -m py_compile skills/inference-optimisation/scripts/*.py tests/*.py
          bash -n skills/inference-optimisation/scripts/*.sh tests/test_queue_lock.sh
