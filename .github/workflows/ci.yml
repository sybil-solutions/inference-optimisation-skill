name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit + end-to-end tests (fake OpenAI server)
        run: python -m unittest discover -s tests -v
      - name: Example ceilings run
        run: python skills/inference-optimisation/scripts/ceiling.py skills/inference-optimisation/examples/ceiling-ornith-b390.json --target 100
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck skills/inference-optimisation/scripts/*.sh
